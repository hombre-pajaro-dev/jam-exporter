<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Review</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1b; --muted: #77746d; --line: #e2dfd8;
    --wave: #b9b5ab; --keep: #2f7d5b; --keep-bg: rgba(47,125,91,.18); --drop-bg: rgba(119,116,109,.12);
    --sel: #d9822b; --head: #c2362f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9a978f; --line: #33322e;
      --wave: #55524b; --keep: #5fbf92; --keep-bg: rgba(95,191,146,.20); --drop-bg: rgba(154,151,143,.10);
      --sel: #f0a24f; --head: #ff6b5e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); }
  #status { margin-left: auto; font-size: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 16px; }
  canvas { width: 100%; height: 110px; display: block; cursor: pointer; }
  .transport { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  #time { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px; border-bottom: 1px solid var(--line); }
  td { padding: 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr.selected td { background: var(--keep-bg); }
  tr.dropped td { opacity: .5; }
  tr.dropped td.name, tr.dropped td.keep { opacity: 1; }
  input[type=text] { font: inherit; width: 100%; min-width: 120px; padding: 4px 6px; border: 1px solid var(--line);
                     border-radius: 6px; background: var(--bg); color: var(--ink); }
  .actions { white-space: nowrap; text-align: right; }
  .table-wrap { overflow-x: auto; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Session</h1>
    <span class="muted" id="summary"></span>
    <span id="status" class="muted"></span>
  </header>

  <div class="panel">
    <canvas id="wave"></canvas>
    <div class="transport">
      <button id="play">▶ Play</button>
      <span id="time">0:00:00</span>
      <span class="muted">Click the waveform to seek. <kbd>Space</kbd> play/pause, <kbd>S</kbd> split at playhead.</span>
    </div>
  </div>

  <div class="panel table-wrap">
    <table>
      <thead><tr><th>#</th><th>Start</th><th>Length</th><th>Name</th><th>Keep</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="muted">Changes save automatically to <code>review.json</code>. When you're done, run
    <code id="exportCmd">scrap export</code> in the terminal.</p>
</main>

<audio id="audio" src="/audio" preload="metadata"></audio>

<script>
const $ = (id) => document.getElementById(id);
const audio = $("audio"), canvas = $("wave"), ctx = canvas.getContext("2d");
let S = null;          // session from the server
let pieces = [];       // [{id, start, end, name, keep}]
let selectedId = null;
let stopAt = null;     // pause playback when reaching this time (playing a single Piece)

const hms = (t) => { t = Math.max(0, Math.floor(t));
  return `${Math.floor(t / 3600)}:${String(Math.floor(t % 3600 / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
const mins = (t) => `${(t / 60).toFixed(1)} min`;
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pieceAt = (t) => pieces.find((p) => p.start <= t && t < p.end);

async function load() {
  S = await (await fetch("/api/session")).json();
  pieces = S.pieces;
  $("title").textContent = S.name;
  document.title = `Review · ${S.name}`;
  $("exportCmd").textContent = `scrap export ${S.name}`;
  render();
}

// ---- saving ----
let saveTimer = null;
function changed({ rerender = true } = {}) {
  if (rerender) render();  // skipped while typing a name so the input keeps focus
  $("status").textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch("/api/review", { method: "PUT", headers: { "Content-Type": "application/json" },
                                             body: JSON.stringify({ pieces }) });
      $("status").textContent = r.ok ? "Saved" : `Save failed: ${await r.text()}`;
    } catch (e) { $("status").textContent = "Save failed — is `scrap review` still running?"; }
  }, 400);
}

// ---- edits ----
function mergeWithNext(i) {
  const a = pieces[i], b = pieces[i + 1];
  a.end = b.end; a.name = a.name || b.name; a.keep = a.keep || b.keep;
  pieces.splice(i + 1, 1);
  changed();
}
function splitAtPlayhead() {
  const t = audio.currentTime, p = pieceAt(t);
  if (!p || t - p.start < 1 || p.end - t < 1) return;
  const id = Math.max(...pieces.map((q) => q.id)) + 1;
  pieces.splice(pieces.indexOf(p) + 1, 0, { id, start: t, end: p.end, name: "", keep: p.keep });
  p.end = t;
  changed();
}
function playPiece(p) {
  selectedId = p.id; stopAt = p.end;
  audio.currentTime = p.start; audio.play();
  render();
}

// ---- rendering ----
function render() {
  const kept = pieces.filter((p) => p.keep);
  $("summary").textContent = `${pieces.length} Pieces · ${kept.length} kept · ${mins(kept.reduce((s, p) => s + p.end - p.start, 0))} kept`;
  const rows = $("rows");
  rows.replaceChildren(...pieces.map((p, i) => {
    const tr = document.createElement("tr");
    tr.className = (p.id === selectedId ? "selected " : "") + (p.keep ? "" : "dropped");
    const td = (cls, ...kids) => { const c = document.createElement("td"); if (cls) c.className = cls; c.append(...kids); return c; };
    const btn = (label, title, fn, disabled = false) => {
      const b = document.createElement("button"); b.textContent = label; b.title = title; b.disabled = disabled;
      b.onclick = fn; return b; };

    const name = document.createElement("input");
    name.type = "text"; name.value = p.name; name.placeholder = "untitled";
    name.oninput = () => { p.name = name.value; changed({ rerender: false }); };
    const keep = document.createElement("input");
    keep.type = "checkbox"; keep.checked = p.keep;
    keep.onchange = () => { p.keep = keep.checked; changed(); };

    tr.append(
      td("", String(i + 1)), td("", hms(p.start)), td("", mins(p.end - p.start)),
      td("name", name), td("keep", keep),
      td("actions",
        btn("▶", "Play this Piece", () => playPiece(p)), " ",
        btn("Merge ↓", "Merge with the next Piece", () => mergeWithNext(i), i === pieces.length - 1)),
    );
    return tr;
  }));
  draw();
}

function draw() {
  if (!S) return;
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const x = (t) => (t / S.duration) * w;

  for (const p of pieces) {
    ctx.fillStyle = p.keep ? css("--keep-bg") : css("--drop-bg");
    ctx.fillRect(x(p.start), 0, Math.max(1, x(p.end) - x(p.start)), h);
    if (p.id === selectedId) { ctx.strokeStyle = css("--sel"); ctx.lineWidth = 2;
      ctx.strokeRect(x(p.start) + 1, 1, x(p.end) - x(p.start) - 2, h - 2); }
  }
  // waveform: dB mapped to bar height, one bar per pixel column
  const wf = S.waveform, lo = -50, hi = -5;
  ctx.fillStyle = css("--wave");
  for (let px = 0; px < w; px++) {
    const a = Math.floor((px / w) * wf.length), b = Math.max(a + 1, Math.floor(((px + 1) / w) * wf.length));
    let m = -Infinity; for (let k = a; k < b; k++) m = Math.max(m, wf[k]);
    const v = Math.min(1, Math.max(0, (m - lo) / (hi - lo))) * (h - 8);
    ctx.fillRect(px, (h - v) / 2, 1, v);
  }
  // Piece numbers
  ctx.fillStyle = css("--muted"); ctx.font = "11px system-ui";
  pieces.forEach((p, i) => { if (x(p.end) - x(p.start) > 14) ctx.fillText(String(i + 1), x(p.start) + 3, 12); });
  // playhead
  ctx.fillStyle = css("--head");
  ctx.fillRect(x(audio.currentTime) - 1, 0, 2, h);
}

// ---- playback ----
canvas.addEventListener("click", (e) => {
  const t = (e.offsetX / canvas.clientWidth) * S.duration;
  const p = pieceAt(t);
  selectedId = p ? p.id : null; stopAt = null;
  audio.currentTime = t;
  render();
});
$("play").onclick = () => (audio.paused ? audio.play() : audio.pause());
audio.addEventListener("play", () => { $("play").textContent = "❚❚ Pause"; tick(); });
audio.addEventListener("pause", () => { $("play").textContent = "▶ Play"; draw(); });
audio.addEventListener("seeked", draw);
function tick() {
  if (stopAt !== null && audio.currentTime >= stopAt) { audio.pause(); stopAt = null; }
  $("time").textContent = `${hms(audio.currentTime)} / ${hms(S.duration)}`;
  draw();
  if (!audio.paused) requestAnimationFrame(tick);
}
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input[type=text]")) return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.key === "s" || e.key === "S") splitAtPlayhead();
});
addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
load();
</script>
</body>
</html>
